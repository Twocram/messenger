name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (backend)
        run: bun run --filter @messenger/backend typecheck

      - name: Typecheck (shared)
        run: bun run --filter @messenger/shared typecheck

      - name: Typecheck (frontend)
        run: bun run --filter @messenger/frontend type-check
